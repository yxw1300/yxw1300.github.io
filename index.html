{slug:'bonding',employer:'d2d',group:'Destination 2D',title:'Multilayer wafer bonding',role:'Founding Process Engineer · 2025—Present',desc:'Bonding development plus quantitative interface inspection and failure analysis.',chips:['Bond energy','IR inspection','Acoustic inspection'],beats:['Developed a multilayer film wafer-bonding process around the material stack.','Established bond-energy extraction and adhesion testing to quantify interface strength.','Used infrared and acoustic inspection to locate voids and delamination.'],outcome:'The bonded stack gained both a process flow and a measurable definition of interface quality.'},
{slug:'doe',employer:'d2d',group:'Destination 2D',title:'Structured DOE campaigns',role:'Founding Process Engineer · 2025—Present',desc:'Single-variable and structured experiments connecting synthesis conditions to film response.',chips:['Deposition','Etch','Anneal'],beats:['Structured process experiments across deposition, etch, and anneal conditions.','Used characterization feedback to separate useful levers from correlated process noise.','Translated observed mechanisms into the next controlled experiment.'],outcome:'The process roadmap advanced through controlled evidence rather than recipe iteration alone.'},
{slug:'software',employer:'d2d',group:'Destination 2D',title:'Process data & ML software',role:'Founding Process Engineer · 2025—Present',desc:'Internal software for structured experimental data, data acquisition, and DOE.',chips:['Python','Data acquisition','DOE'],beats:['Developed internal software to structure experimental data for process development.','Connected data acquisition and analysis workflows to DOE planning.','Prepared structured process data for AI-assisted analysis.'],outcome:'Experimental data became more consistent and usable for structured process development.'},
{slug:'interface',employer:'d2d',group:'Destination 2D',title:'Foundry qualification test structures',role:'Founding Process Engineer · 2025—Present',desc:'Designed and fabricated test structures for foundry qualification of the material process.',chips:['Test structures','Foundry qualification','Device measurement'],beats:['Designed test structures around foundry qualification requirements.','Fabricated the structures through the material and device process flow.','Collected device-level measurements as qualification evidence.'],outcome:'The process gained concrete test structures and device-level measurements for foundry qualification.'},
{slug:'film-development',employer:'science',group:'Science Co.',title:'Film process development',role:'MicroFab Engineer · 2024—2025',desc:'Process breadth across SiC, SiN, AlN, Al₂O₃, and TiN—with depth in film control for dielectrics and electrodes.',chips:['5 material systems','Dielectrics','Electrodes'],beats:['Developed and sustained thin-film processes across SiC, SiN, AlN, Al₂O₃, and TiN.','Worked across deposition, plasma processing, film stress, conformality, and interface performance.','Connected film properties to device requirements and process stability.'],outcome:'A broad film portfolio was treated as a set of controlled material systems, not isolated recipes.'},
{slug:'bci',employer:'science',group:'Science Co.',title:'4,000-channel neural devices',role:'MicroFab Engineer · 2024—2025',desc:'Full microfabrication-flow ownership for high-channel-count neural recording implants.',chips:['4,000 channels','+10% yield','+30% functionality'],beats:['Owned deposition, lithography, etch, and singulation for biocompatible neural implants.','Traced SiC encapsulation delamination to composition contamination and high film stress, resolved both, and moved the process in-house.','Used polymer curing, surface activation, deposition conformality, and etch uniformity to raise yield by 10% and functionality by 30%.','Developed low-impedance TiN electrodes and ran accelerated chemical-stability and service-life tests.'],outcome:'A complex implant flow became more reliable, more functional, and less dependent on an external facility.'},
{slug:'mems',employer:'photonwares',group:'Photonwares Co.',title:'MEMS microfluidics',role:'MEMS Process Engineer · 2023',desc:'DRIE microfluidic fabrication with sputtered oxide, equipment qualification, FMEA, and SPC.',chips:['DRIE','Sputtered oxide','FMEA · SPC'],beats:['Fabricated MEMS microfluidic devices using DRIE and sputtered oxide.','Installed and qualified a LAM 590 RIE, then resolved an RF matching network fault.','Maintained Denton evaporators and STS DRIE systems supporting the process line.','Applied SEM inspection, FMEA, and SPC, and led customer-facing final product inspection.'],outcome:'The line gained qualified equipment, disciplined process control, and accountable final inspection.'},
{slug:'pecvd-graphene',employer:'research',group:'UC Berkeley',title:'Polymer-to-graphene conversion',role:'Graduate Researcher · 2022—2023',desc:'Plasma- and laser-based conversion of polyimide into graphene.',chips:['+60% efficiency','+80% accuracy','PECVD · laser'],beats:['Developed a plasma- and laser-based route for converting polyimide into graphene.','Improved dip-coating efficiency by 60% through process refinement.','Designed a CAD-modeled, 3D-printed fixture for repeatable sample handling.','Improved fixture accuracy by 80% and reduced a key source of experimental variation.'],outcome:'A research process became faster and more repeatable through process and fixture redesign.'},
{slug:'tmd-fets',employer:'research',group:'Case Western Reserve',title:'TMD 2D FETs',role:'Undergraduate Researcher · 2018—2022',desc:'Fabrication and characterization of layered-semiconductor transistors.',chips:['InSe · GaSe · WSe₂','Mobility · Vth','n → p conversion'],beats:['Fabricated and characterized FETs using InSe, GaSe, Sn-doped InSe, and WSe₂.','Measured mobility, threshold-voltage shift, and thickness dependence.','Demonstrated n-type to p-type conversion through Fermi-level alignment.','Drafted a journal manuscript on doping effects in InSe transistors.'],outcome:'Device measurements connected material choice and doping to transistor behavior.'}

function loopSVG(){var cx=240,cy=215,r=150;function pt(a){a=a*Math.PI/180;return [(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)]}function arc(a1,a2){var p1=pt(a1),p2=pt(a2);return '<path class="loop-arc" marker-end="url(#loopArrow)" d="M'+p1[0]+' '+p1[1]+'A'+r+' '+r+' 0 0 1 '+p2[0]+' '+p2[1]+'"/>'}var st=[[-90,'Design',240,38,'middle'],[30,'Build',382,332,'start'],[150,'Break',98,332,'end']];return '<figure class="loop" aria-label="A loop: design, then build, then break, then back to design until something works"><svg id="loopSvg" viewBox="0 0 480 400" role="img"><defs><marker id="loopArrow" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path class="loop-head" d="M0 1 8 5 0 9z"/></marker></defs><circle class="loop-ring" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>'+arc(-76,16)+arc(44,136)+arc(164,256)+st.map(function(s,i){var p=pt(s[0]);return '<g class="loop-station" data-i="'+i+'"><circle class="loop-halo" cx="'+p[0]+'" cy="'+p[1]+'" r="16"/><circle class="loop-node" cx="'+p[0]+'" cy="'+p[1]+'" r="7"/><text class="loop-name" x="'+s[2]+'" y="'+s[3]+'" text-anchor="'+s[4]+'">'+s[1]+'</text></g>'}).join('')+'<circle class="loop-dot" cx="'+cx+'" cy="'+(cy-r)+'" r="5"/><text class="loop-kicker" x="'+cx+'" y="'+(cy-18)+'" text-anchor="middle">iteration</text><text class="loop-count" x="'+cx+'" y="'+(cy+36)+'" text-anchor="middle">01</text></svg></figure>'}

rocess-development work across advanced materials, neural interfaces, and microfabricated devices.<\/p>\n        <span class=\"cue\"><i><\/i> Scroll to explore<\/span>\n      <\/div>\n    <\/header>\n\n    <article class=\"project\" id=\"d2d\">\n      <div class=\"project-visual\" data-index=\"01 / 03\" aria-label=\"Chip package with a graphene heat-spreading layer\">\n        <p class=\"employer\">Destination 2D<\/p>\n        <svg class=\"diagram\" viewBox=\"0 0 520 420\" role=\"img\" aria-labelledby=\"d2dDiagramTitle\">\n          <title id=\"d2dDiagramTitle\">Heat rising from a buried stack, spreading laterally, and continuing into a heat sink<\/title>\n          <path class=\"fill\" d=\"M112 225h296v70H112z\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M74 295h372v45H74zM94 340v24M148 340v24M202 340v24M256 340v24M310 340v24M364 340v24M418 340v24M74 364h372\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M150 225v-64h220v64M180 161v-34h160v34M206 127V93h108v34\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M98 213c31 10 47-10 78 0s47-10 78 0 47-10 78 0 47-10 90 0M98 205c31 10 47-10 78 0s47-10 78 0 47-10 78 0 47-10 90 0\"/>\n          <rect class=\"heat-source\" x=\"188\" y=\"312\" width=\"144\" height=\"12\" rx=\"6\"/>\n          <path class=\"heat-path\" pathLength=\"1\" d=\"M212 312C214 276 226 244 249 214\"/>\n          <path class=\"heat-path\" pathLength=\"1\" d=\"M308 312C306 276 294 244 271 214\"/>\n          <path class=\"heat-path\" pathLength=\"1\" d=\"M260 312V214\"/>\n          <path class=\"heat-path\" pathLength=\"1\" d=\"M258 209C217 194 165 196 108 209\"/>\n          <path class=\"heat-path\" pathLength=\"1\" d=\"M262 209C303 194 355 196 412 209\"/>\n          <path class=\"heat-path\" pathLength=\"1\" d=\"M260 205V104\"/>\n          <circle class=\"heat-core\" cx=\"260\" cy=\"209\" r=\"10\"/>\n        <\/svg>\n      <\/div>\n      <div class=\"project-copy\">\n        <h2>CMOS BEOL-compatible multilayer graphene<\/h2>\n        <p class=\"descriptor\">Integrated thermal spreader for advanced packaging.<\/p>\n        <ol class=\"deliverables\">\n          <li><a href=\"#/work/technical/detail-d2d-process\">Coupon → 300 mm wafer scale-up<\/a><\/li>\n          <li><a href=\"#/work/technical/detail-d2d-device\">Thermal test vehicle<\/a><\/li>\n          <li><a href=\"#/work/technical/detail-d2d-equipment\">Equipment ownership<\/a><\/li>\n        <\/ol>\n      <\/div>\n    <\/article>\n\n    <article class=\"project\" id=\"science\">\n      <div class=\"project-visual\" data-index=\"02 / 03\" aria-label=\"Brain-computer interface and electrode array illustration\">\n        <p class=\"employer\">Science Corporation<\/p>\n        <svg class=\"diagram\" viewBox=\"0 0 520 420\" role=\"img\" aria-labelledby=\"scienceDiagramTitle\">\n          <title id=\"scienceDiagramTitle\">Human profile connected to a dense electrode array<\/title>\n          <path class=\"draw\" pathLength=\"1\" d=\"M95 292c12-34 40-54 78-62v-30c-20-17-31-43-31-73 0-50 29-83 74-83 46 0 74 35 74 84 0 31-11 56-32 73v31c24 6 44 16 59 32\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M175 93c17-26 57-30 81-4M197 232c16 8 31 8 46 0\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M256 92c36-12 77-4 100 25M356 117l-4 43\"/>\n          <g class=\"draw\">\n            <rect x=\"338\" y=\"145\" width=\"118\" height=\"118\" rx=\"6\"/>\n            <path d=\"M354 161v86M371 161v86M388 161v86M405 161v86M422 161v86M439 161v86M354 161h86M354 178h86M354 195h86M354 212h86M354 229h86M354 246h86\"/>\n          <\/g>\n          <path class=\"signal-path\" pathLength=\"1\" d=\"M256 92C292 80 333 88 356 117L352 160\"/>\n          <path class=\"signal-path reverse\" pathLength=\"1\" d=\"M256 92C292 80 333 88 356 117L352 160\"/>\n          <circle class=\"accent\" cx=\"256\" cy=\"92\" r=\"7\"/>\n        <\/svg>\n      <\/div>\n      <div class=\"project-copy\">\n        <h2>4,000-channel multi-electrode array<\/h2>\n        <p class=\"descriptor\">Full-stack microfabrication for a high-density brain–computer interface.<\/p>\n        <ol class=\"deliverables\">\n          <li><a href=\"#/work/technical/detail-science-fabrication\">Full device fabrication<\/a><\/li>\n          <li><a href=\"#/work/technical/detail-science-films\">Functional film development<\/a><\/li>\n          <li><a href=\"#/work/technical/detail-science-equipment\">Equipment ownership &amp; sustainment<\/a><\/li>\n        <\/ol>\n      <\/div>\n    <\/article>\n\n    <article class=\"project\" id=\"photonwares\">\n      <div class=\"project-visual\" data-index=\"03 / 03\" aria-label=\"Microfluidic MEMS micropillar illustration\">\n        <p class=\"employer\">Photonwares<\/p>\n        <svg class=\"diagram\" viewBox=\"0 0 520 420\" role=\"img\" aria-labelledby=\"photonDiagramTitle\">\n          <title id=\"photonDiagramTitle\">Microfluidic MEMS structure with micropillar array<\/title>\n          <path class=\"draw\" pathLength=\"1\" d=\"M57 304H463M76 254h368v50H76zM91 238h338l15 16H76z\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M103 151v87M138 151v87M173 151v87M208 151v87M243 151v87M278 151v87M313 151v87M348 151v87M383 151v87M418 151v87\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M89 151h343M65 130h390M65 130c12-28 37-42 75-42h240c38 0 63 14 75 42\"/>\n          <path class=\"draw\" pathLength=\"1\" d=\"M228 88V54M292 88V54\"/>\n          <path class=\"fluid-path\" pathLength=\"1\" d=\"M65 130H455\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M103 238V130\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M138 238V130\" style=\"animation-delay:-.18s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M173 238V130\" style=\"animation-delay:-.36s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M208 238V130\" style=\"animation-delay:-.54s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M243 238V130\" style=\"animation-delay:-.72s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M278 238V130\" style=\"animation-delay:-.9s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M313 238V130\" style=\"animation-delay:-1.08s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M348 238V130\" style=\"animation-delay:-1.26s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M383 238V130\" style=\"animation-delay:-1.44s\"/>\n          <path class=\"fluid-path vertical\" pathLength=\"1\" d=\"M418 238V130\" style=\"animation-delay:-1.62s\"/>\n          <circle class=\"accent\" cx=\"65\" cy=\"130\" r=\"6\"/>\n          <circle class=\"accent\" cx=\"455\" cy=\"130\" r=\"6\"/>\n        <\/svg>\n      <\/div>\n      <div class=\"project-copy\">\n        <h2>Organ-on-chip microfluidic MEMS structure<\/h2>\n        <p class=\"descriptor\">Process ownership for a microfabricated device built around a dense micropillar array.<\/p>\n        <ol class=\"deliverables\">\n          <li><a href=\"#/work/technical/detail-photonwares-drie\">Full device fabrication<\/a><\/li>\n          <li><a href=\"#/work/technical/detail-photonwares-control\">Customer-facing process control<\/a><\/li>\n          <li><a href=\"#/work/technical/detail-photonwares-equipment\">Equipment maintenance<\/a><\/li>\n        <\/ol>\n      <\/div>\n    <\/article>\n\n    <footer class=\"endnote\">\n      <strong>From material to device.<\/strong>\n      <span>Process development · fabrication · scale-up<\/span>\n    <\/footer>\n  <\/main>\n\n  <main class=\"detail-page\" id=\"detail-d2d-process\" hidden>\n    <nav class=\"detail-topbar\"><a class=\"back-link\" href=\"#/work/technical/d2d\">Technical projects<\/a><span class=\"detail-index\">D2D · 01<\/span><\/nav>\n    <section class=\"detail-hero\"><div><p class=\"employer\">Destination 2D<\/p><h2>Coupon → 300 mm wafer scale-up<\/h2><\/div><p class=\"detail-lede\">From a research idea to a scalable process at a BEOL-compatible thermal budget.<\/p><\/section><section class=\"detail-figure\"><figure class=\"figure\"><div class=\"fig-scroll\"><svg class=\"fig\" viewBox=\"0 0 900 400\" role=\"img\"><title>Coupon, 150 mm and 300 mm wafers at relative scale<\/title><defs><clipPath id=\"w300\"><circle cx=\"680\" cy=\"180\" r=\"147\"/><\/clipPath><\/defs><rect class=\"a pop\" style=\"animation-delay:.1s\" x=\"90\" y=\"169\" width=\"22\" height=\"22\" rx=\"1\"/><path class=\"flow\" pathLength=\"1\" d=\"M140 180H222\"/><path class=\"ah\" d=\"M219 175 L228 180 L219 185\"/><g class=\"pop\" style=\"animation-delay:.45s\"><circle class=\"f\" cx=\"320\" cy=\"180\" r=\"75\"/><circle class=\"m\" cx=\"320\" cy=\"180\" r=\"50\"/><circle class=\"m\" cx=\"320\" cy=\"180\" r=\"25\"/><path class=\"d\" d=\"M314 255l6-7 6 7\"/><\/g><path class=\"flow\" pathLength=\"1\" d=\"M418 180H490\"/><path class=\"ah\" d=\"M487 175 L496 180 L487 185\"/><g class=\"pop\" style=\"animation-delay:.8s\"><circle class=\"f\" cx=\"680\" cy=\"180\" r=\"150\"/><g clip-path=\"url(#w300)\"><path class=\"m\" d=\"M530 30V330\"/><path class=\"m\" d=\"M560 30V330\"/><path class=\"m\" d=\"M590 30V330\"/><path class=\"m\" d=\"M620 30V330\"/><path class=\"m\" d=\"M650 30V330\"/><path class=\"m\" d=\"M680 30V330\"/><path class=\"m\" d=\"M710 30V330\"/><path class=\"m\" d=\"M740 30V330\"/><path class=\"m\" d=\"M770 30V330\"/><path class=\"m\" d=\"M800 30V330\"/><path class=\"m\" d=\"M830 30V330\"/><path class=\"m\" d=\"M530 30H830\"/><path class=\"m\" d=\"M530 60H830\"/><path class=\"m\" d=\"M530 90H830\"/><path class=\"m\" d=\"M530 120H830\"/><path class=\"m\" d=\"M530 150H830\"/><path class=\"m\" d=\"M530 180H830\"/><path class=\"m\" d=\"M530 210H830\"/><path class=\"m\" d=\"M530 240H830\"/><path class=\"m\" d=\"M530 270H830\"/><path class=\"m\" d=\"M530 300H830\"/><path class=\"m\" d=\"M530 330H830\"/><\/g><path class=\"d\" d=\"M674 330l6-7 6 7\"/><path class=\"d thick\" d=\"M811.6 104.0L823.8 97.0\"/><path class=\"d thick\" d=\"M548.4 256.0L536.2 263.0\"/><path class=\"d thick\" d=\"M680.0 28.0L680.0 14.0\"/><\/g><circle class=\"a site\" style=\"animation-delay:1.20s\" cx=\"680\" cy=\"180\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:1.32s\" cx=\"680\" cy=\"100\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:1.44s\" cx=\"680\" cy=\"260\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:1.56s\" cx=\"600\" cy=\"180\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:1.68s\" cx=\"760\" cy=\"180\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:1.80s\" cx=\"623\" cy=\"123\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:1.92s\" cx=\"737\" cy=\"123\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:2.04s\" cx=\"623\" cy=\"237\" r=\"4.5\"/><circle class=\"a site\" style=\"animation-delay:2.16s\" cx=\"737\" cy=\"237\" r=\"4.5\"/><path class=\"m\" d=\"M822 96L842 78\"/><text class=\"tl\" x=\"846\" y=\"74\" text-anchor=\"start\">HOLDER<\/text><text class=\"tl\" x=\"101\" y=\"370\" text-anchor=\"middle\">COUPON<\/text><text class=\"\" x=\"101\" y=\"390\" text-anchor=\"middle\">mechanism<\/text><text class=\"tl\" x=\"320\" y=\"370\" text-anchor=\"middle\">150 MM<\/text><text class=\"\" x=\"320\" y=\"390\" text-anchor=\"middle\">uniformity · stress<\/text><text class=\"tl\" x=\"680\" y=\"370\" text-anchor=\"middle\">300 MM<\/text><text class=\"\" x=\"680\" y=\"390\" text-anchor=\"middle\">holder · recipe rebuild<\/text><\/svg><\/div><figcaption>Wafers drawn to relative scale; coupon shown for reference. Dots mark a cross-wafer measurement map; ticks mark holder contact points.<\/figcaption><\/figure><\/section><section class=\"detail-body\"><p class=\"detail-label\">Development arc<\/p><div><ol class=\"arc\"><li><span class=\"n\">01<\/span><h3>Research idea<\/h3><p>A graphene heat spreader that forms inside the thermal budget of a finished chip’s back end, a window where conventional growth doesn’t work. The concept existed; a process didn’t.<\/p><\/li><li><span class=\"n\">02<\/span><h3>Coupon process<\/h3><p>Proved the mechanism on small coupons. Structured DOE across deposition, etch and anneal steps tied each process knob to film quality, coverage and adhesion, read out by Raman and XRD.<\/p><\/li><li><span class=\"n\">03<\/span><h3>150 mm wafers<\/h3><p>Moving to full wafers changed the problem from “does it grow” to “does it grow the same everywhere.” Cross-wafer uniformity, film stress and wafer bow became the metrics that mattered.<\/p><\/li><li><span class=\"n\">04<\/span><h3>300 mm transfer<\/h3><p>Redesigned the substrate holder and rebuilt the deposition recipe for the larger format, resolving the stress and uniformity issues that came with it.<\/p><\/li><\/ol><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Along the way<\/p><div><ul class=\"notes\"><li><h3>Data backbone<\/h3><p>Built internal data-acquisition software and a process–property database so every run is traceable and ready for AI-assisted analysis.<\/p><\/li><li><h3>Foundry interface<\/h3><p>Served as the technical point of contact for foundry collaboration, aligning the film’s specifications with partner requirements.<\/p><\/li><\/ul><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Outcome<\/p><div><p class=\"single-statement\">A research concept turned into a wafer-scale, BEOL-compatible process.<\/p><dl class=\"facts\"><div><dt>Coupon → 300 mm<\/dt><dd>scale path<\/dd><\/div><div><dt>3<\/dt><dd>pending U.S. patent applications<\/dd><\/div><div><dt>BEOL<\/dt><dd>compatible thermal budget<\/dd><\/div><\/dl><\/div><\/section><nav class=\"detail-next\" aria-label=\"More projects\"><span><\/span><a class=\"pn next\" href=\"#/work/technical/detail-d2d-device\"><small>Next<\/small>Thermal test vehicle<\/a><\/nav>\n  <\/main>\n\n  <main class=\"detail-page\" id=\"detail-d2d-device\" hidden>\n    <nav class=\"detail-topbar\"><a class=\"back-link\" href=\"#/work/technical/d2d\">Technical projects<\/a><span class=\"detail-index\">D2D · 02<\/span><\/nav>\n    <section class=\"detail-hero\"><div><p class=\"employer\">Destination 2D<\/p><h2>Thermal test vehicle<\/h2><\/div><p class=\"detail-lede\">Device fabrication and performance-data extraction for the integrated heat-spreader platform.<\/p><\/section><section class=\"detail-figure\"><figure class=\"figure\"><div class=\"fig-scroll\"><svg class=\"fig\" viewBox=\"0 0 900 400\" role=\"img\"><title>Top view of a heater and sensors, and a temperature-versus-distance sketch<\/title><defs><clipPath id=\"die\"><rect x=\"40\" y=\"40\" width=\"440\" height=\"320\"/><\/clipPath><\/defs><rect class=\"f\" x=\"40\" y=\"40\" width=\"440\" height=\"320\"/><g clip-path=\"url(#die)\"><circle class=\"ring\" style=\"animation-delay:0.00s\" cx=\"120\" cy=\"200\" r=\"330\"/><circle class=\"ring\" style=\"animation-delay:-1.07s\" cx=\"120\" cy=\"200\" r=\"330\"/><circle class=\"ring\" style=\"animation-delay:-2.14s\" cx=\"120\" cy=\"200\" r=\"330\"/><\/g><path class=\"as\" d=\"M100 172 h40 v8 h-40 v8 h40 v8 h-40 v8 h40 v8 h-40 v8 h40 v8 h40\"/><path class=\"d\" d=\"M200 216V184H210V216\"/><path class=\"d\" d=\"M270 216V184H280V216\"/><path class=\"d\" d=\"M340 216V184H350V216\"/><path class=\"d\" d=\"M410 216V184H420V216\"/><text class=\"tl\" x=\"120\" y=\"152\" text-anchor=\"middle\">HEATER<\/text><text class=\"tl\" x=\"305\" y=\"244\" text-anchor=\"middle\">SENSORS<\/text><path class=\"m\" d=\"M120 300H415M120 294v12M415 294v12\"/><text class=\"\" x=\"267\" y=\"324\" text-anchor=\"middle\">distance from hot spot<\/text><path class=\"d\" d=\"M540 60V330H870\"/><text class=\"tl\" x=\"530\" y=\"58\" text-anchor=\"end\">T<\/text><text class=\"\" x=\"870\" y=\"354\" text-anchor=\"end\">distance<\/text><path class=\"m dash\" d=\"M550 95C600 255 680 300 860 315\"/><path class=\"as draw-in\" pathLength=\"1\" d=\"M550 170C640 220 740 250 860 262\"/><circle class=\"a\" cx=\"605.3\" cy=\"197.6\" r=\"4.5\"/><circle class=\"a\" cx=\"669.4\" cy=\"222.6\" r=\"4.5\"/><circle class=\"a\" cx=\"737.7\" cy=\"241.9\" r=\"4.5\"/><circle class=\"a\" cx=\"810.7\" cy=\"255.9\" r=\"4.5\"/><path class=\"as\" d=\"M690 84h26\"/><text class=\"tl\" x=\"724\" y=\"88\" text-anchor=\"start\">with spreader<\/text><path class=\"m dash\" d=\"M690 106h26\"/><text class=\"\" x=\"724\" y=\"110\" text-anchor=\"start\">without<\/text><\/svg><\/div><figcaption>Concept only: a local hot spot with sensors at increasing distance. A good lateral spreader flattens the temperature profile. Not measured data.<\/figcaption><\/figure><\/section><section class=\"detail-body\"><p class=\"detail-label\">Workstream<\/p><div><ol class=\"arc\"><li><span class=\"n\">01<\/span><h3>Model first<\/h3><p>Built an interfacial thermal-resistance model to predict what the film could deliver. Catching a flawed input in that model redirected development toward interface engineering.<\/p><\/li><li><span class=\"n\">02<\/span><h3>Device design<\/h3><p>Designed test structures that isolate in-plane heat spreading: an on-chip heater with resistive temperature sensors at increasing distances.<\/p><\/li><li><span class=\"n\">03<\/span><h3>Fabrication<\/h3><p>Patterned the structures in-house with e-beam lithography and RIE, alongside interdigitated-electrode, serpentine, via-chain and Hall-bar devices for electrical and interconnect characterization.<\/p><\/li><li><span class=\"n\">04<\/span><h3>Data extraction<\/h3><p>Calibrated the sensors, extracted thermal behavior, and validated the model against measured device performance.<\/p><\/li><\/ol><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Outcome<\/p><div><p class=\"single-statement\">Development decisions grounded in a model checked against real devices.<\/p><dl class=\"facts\"><div><dt>Model ↔ device<\/dt><dd>validated loop<\/dd><\/div><div><dt>4<\/dt><dd>companion test-structure types<\/dd><\/div><\/dl><\/div><\/section><nav class=\"detail-next\" aria-label=\"More projects\"><a class=\"pn prev\" href=\"#/work/technical/detail-d2d-process\"><small>Previous<\/small>Coupon → 300 mm wafer scale-up<\/a><a class=\"pn next\" href=\"#/work/technical/detail-d2d-equipment\"><small>Next<\/small>Equipment ownership<\/a><\/nav>\n  <\/main>\n\n  <main class=\"detail-page\" id=\"detail-d2d-equipment\" hidden>\n    <nav class=\"detail-topbar\"><a class=\"back-link\" href=\"#/work/technical/d2d\">Technical projects<\/a><span class=\"detail-index\">D2D · 03<\/span><\/nav>\n    <section class=\"detail-hero\"><div><p class=\"employer\">Destination 2D<\/p><h2>Equipment ownership<\/h2><\/div><p class=\"detail-lede\">High-vacuum process-equipment stewardship across operation, troubleshooting, repair, and sustainment.<\/p><\/section><section class=\"detail-figure\"><figure class=\"figure\"><div class=\"fig-scroll\"><svg class=\"fig\" viewBox=\"0 0 900 400\" role=\"img\"><title>Schematic floor plan of a lab built from an empty room<\/title><path class=\"d thick\" d=\"M40 40H860V360H520M440 360H40Z\"/><path class=\"m\" d=\"M440 360a80 80 0 0 1 80-80\"/><g class=\"pop\" style=\"animation-delay:0.15s\"><rect class=\"f\" x=\"90\" y=\"80\" width=\"170\" height=\"110\" rx=\"3\"/><circle class=\"d\" cx=\"175\" cy=\"130\" r=\"30\"/><path class=\"m\" d=\"M160 130h30M175 115v30\"/><text class=\"tl\" x=\"175.0\" y=\"212\" text-anchor=\"middle\">PVD<\/text><\/g><g class=\"pop\" style=\"animation-delay:0.37s\"><rect class=\"f\" x=\"310\" y=\"80\" width=\"150\" height=\"110\" rx=\"3\"/><rect class=\"d\" x=\"350\" y=\"102\" width=\"70\" height=\"56\" rx=\"6\"/><path class=\"m\" d=\"M362 118h46M362 142h46\"/><text class=\"tl\" x=\"385.0\" y=\"212\" text-anchor=\"middle\">RIE<\/text><\/g><g class=\"pop\" style=\"animation-delay:0.59s\"><rect class=\"f\" x=\"510\" y=\"80\" width=\"300\" height=\"70\" rx=\"3\"/><circle class=\"d\" cx=\"560\" cy=\"115\" r=\"14\"/><rect class=\"d\" x=\"610\" y=\"100\" width=\"40\" height=\"30\"/><path class=\"d\" d=\"M700 130v-26h20v26M760 104l20 26\"/><text class=\"tl\" x=\"660.0\" y=\"172\" text-anchor=\"middle\">METROLOGY<\/text><\/g><g class=\"pop\" style=\"animation-delay:0.81s\"><rect class=\"f\" x=\"90\" y=\"270\" width=\"90\" height=\"70\" rx=\"3\"/><text class=\"tl\" x=\"135.0\" y=\"310.0\" text-anchor=\"middle\">GAS<\/text><\/g><g class=\"pop\" style=\"animation-delay:1.03s\"><rect class=\"f\" x=\"230\" y=\"270\" width=\"90\" height=\"70\" rx=\"3\"/><text class=\"tl\" x=\"275.0\" y=\"310.0\" text-anchor=\"middle\">WATER<\/text><\/g><path class=\"flow\" pathLength=\"1\" d=\"M135 270V238H385V190\"/><path class=\"flow\" pathLength=\"1\" d=\"M175 238V190\"/><path class=\"flow cool\" pathLength=\"1\" d=\"M275 270V252H420V190\"/><path class=\"flow cool\" pathLength=\"1\" d=\"M275 252H215V190\"/><path class=\"as\" d=\"M560 300h28\"/><text class=\"\" x=\"596\" y=\"304\" text-anchor=\"start\">process gas<\/text><path class=\"m\" d=\"M560 326h28\" style=\"stroke-width:2.5\"/><text class=\"\" x=\"596\" y=\"330\" text-anchor=\"start\">cooling water<\/text><\/svg><\/div><figcaption>Schematic of the lab stood up from an empty room: tools, process gas and cooling water. Layout simplified.<\/figcaption><\/figure><\/section><section class=\"detail-body\"><p class=\"detail-label\">Ownership scope<\/p><div><ol class=\"arc\"><li><span class=\"n\">01<\/span><h3>Install &amp; qualify<\/h3><p>Specified, purchased, installed and qualified the PVD deposition system, RIE, metrology tools and the gas and water delivery behind them.<\/p><\/li><li><span class=\"n\">02<\/span><h3>Recipe development<\/h3><p>Built the baseline recipes every experiment runs on, then extended them as the process moved from coupons to 300 mm.<\/p><\/li><li><span class=\"n\">03<\/span><h3>Troubleshooting<\/h3><p>First line on high-vacuum faults: operation, diagnosis, repair and return to service.<\/p><\/li><li><span class=\"n\">04<\/span><h3>Process control &amp; training<\/h3><p>Documented procedures and trained users so the tools run consistently, whoever is running them.<\/p><\/li><\/ol><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Outcome<\/p><div><p class=\"single-statement\">An empty room turned into a working process lab.<\/p><dl class=\"facts\"><div><dt>0 → running lab<\/dt><dd>built from an empty space<\/dd><\/div><div><dt>PVD · RIE · metrology<\/dt><dd>tools owned<\/dd><\/div><\/dl><\/div><\/section><nav class=\"detail-next\" aria-label=\"More projects\"><a class=\"pn prev\" href=\"#/work/technical/detail-d2d-device\"><small>Previous<\/small>Thermal test vehicle<\/a><a class=\"pn next\" href=\"#/work/technical/detail-science-fabrication\"><small>Next<\/small>Full device fabrication<\/a><\/nav>\n  <\/main>\n\n  <main class=\"detail-page\" id=\"detail-science-fabrication\" hidden>\n    <nav class=\"detail-topbar\"><a class=\"back-link\" href=\"#/work/technical/science\">Technical projects<\/a><span class=\"detail-index\">SCIENCE · 01<\/span><\/nav>\n    <section class=\"detail-hero\"><div><p class=\"employer\">Science Corporation<\/p><h2>Full device fabrication<\/h2><\/div><p class=\"detail-lede\">An end-to-end thin-film-to-dicing fabrication flow for a 4,000-channel electrode array.<\/p><\/section><section class=\"detail-figure\"><figure class=\"figure\"><div class=\"fig-scroll\"><svg class=\"fig\" viewBox=\"0 0 900 340\" role=\"img\"><title>Electrode array on an ASIC, bonded to a substrate that routes signals to a data-acquisition system<\/title><rect class=\"f\" x=\"80\" y=\"232\" width=\"560\" height=\"34\"/><path class=\"m\" d=\"M226 240H200V252H620M278 240V246H620\"/><rect class=\"f\" x=\"200\" y=\"162\" width=\"300\" height=\"50\"/><text class=\"tl\" x=\"350\" y=\"193\" text-anchor=\"middle\">ASIC<\/text><path class=\"elec\" d=\"M210 162v-8M218 162v-8M226 162v-8M234 162v-8M242 162v-8M250 162v-8M258 162v-8M266 162v-8M274 162v-8M282 162v-8M290 162v-8M298 162v-8M306 162v-8M314 162v-8M322 162v-8M330 162v-8M338 162v-8M346 162v-8M354 162v-8M362 162v-8M370 162v-8M378 162v-8M386 162v-8M394 162v-8M402 162v-8M410 162v-8M418 162v-8M426 162v-8M434 162v-8M442 162v-8M450 162v-8M458 162v-8M466 162v-8M474 162v-8M482 162v-8M490 162v-8\"/><circle class=\"dot\" cx=\"222\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"254\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"286\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"318\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"350\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"382\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"414\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"446\" cy=\"222\" r=\"8\"/><circle class=\"dot\" cx=\"478\" cy=\"222\" r=\"8\"/><rect class=\"f\" x=\"640\" y=\"238\" width=\"26\" height=\"22\"/><path class=\"flow\" pathLength=\"1\" d=\"M460 246H640\"/><path class=\"flow\" pathLength=\"1\" d=\"M666 249C724 249 716 190 772 190\"/><path class=\"ah\" d=\"M769 185 L778 190 L769 195\"/><rect class=\"f\" x=\"780\" y=\"148\" width=\"92\" height=\"84\" rx=\"3\"/><text class=\"tl\" x=\"826\" y=\"195\" text-anchor=\"middle\">DAQ<\/text><path class=\"m\" d=\"M350 110V148\"/><text class=\"tl\" x=\"350\" y=\"102\" text-anchor=\"middle\">ELECTRODE ARRAY ON THE ASIC<\/text><path class=\"m\" d=\"M120 138L212 214\"/><text class=\"tl\" x=\"40\" y=\"130\" text-anchor=\"start\">BUMPS · FLIP-CHIP BOND<\/text><path class=\"m\" d=\"M360 300V270\"/><text class=\"tl\" x=\"360\" y=\"318\" text-anchor=\"middle\">SUBSTRATE<\/text><text class=\"\" x=\"722\" y=\"172\" text-anchor=\"middle\">signal out<\/text><\/svg><\/div><figcaption>Simplified: the electrode array sits on the ASIC, the ASIC is bonded to a substrate, and the substrate carries signals out to the DAQ. Not to scale.<\/figcaption><\/figure><\/section><section class=\"detail-body\"><p class=\"detail-label\">Wafer fabrication<\/p><div><ol class=\"sequence\" style=\"--count:4\"><li>Install &amp; qualify<\/li><li>Recipe development<\/li><li>Troubleshooting<\/li><li>Process control &amp; training<\/li><\/ol><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Flip chip &amp; packaging<\/p><div><ol class=\"arc\"><li><span class=\"n\">01<\/span><h3>Bumps<\/h3><p>Electroplated gold bumps for the flip-chip interconnect, tuning plating uniformity so every bump lands.<\/p><\/li><li><span class=\"n\">02<\/span><h3>Flip-chip &amp; reflow<\/h3><p>Bonded the ASIC, electrode array and all, onto the substrate that routes its signals out to the data-acquisition system, then reflowed, managing the thermal stress that step puts on the film stack.<\/p><\/li><li><span class=\"n\">03<\/span><h3>Wire bonding<\/h3><p>Made the wire-bonded connections in the assembly.<\/p><\/li><li><span class=\"n\">04<\/span><h3>Epoxy molding<\/h3><p>Encapsulated with epoxy and polymer cures chosen to protect the bonds without cracking the films underneath.<\/p><\/li><\/ol><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Yield<\/p><div><ul class=\"notes\"><li><h3>Cracking during reflow<\/h3><p>Traced film cracking to CTE mismatch and thermal stress; adjusted cure and film stress to stop it.<\/p><\/li><li><h3>Delamination<\/h3><p>Resolved metal-on-polyimide delamination through curing and surface-activation changes.<\/p><\/li><li><h3>Test structures<\/h3><p>Designed on-glass structures for electrode, via/contact yield and accelerated lifetime testing, so problems showed up before devices.<\/p><\/li><\/ul><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Outcome<\/p><div><p class=\"single-statement\">The full flow for a 4,000-channel neural recording device, from bare substrate to packaged die.<\/p><dl class=\"facts\"><div><dt>4,000<\/dt><dd>channels per device<\/dd><\/div><div><dt>Substrate → die<\/dt><dd>end-to-end ownership<\/dd><\/div><\/dl><\/div><\/section><nav class=\"detail-next\" aria-label=\"More projects\"><a class=\"pn prev\" href=\"#/work/technical/detail-d2d-equipment\"><small>Previous<\/small>Equipment ownership<\/a><a class=\"pn next\" href=\"#/work/technical/detail-science-films\"><small>Next<\/small>Functional film development<\/a><\/nav>\n  <\/main>\n\n  <main class=\"detail-page\" id=\"detail-science-films\" hidden>\n    <nav class=\"detail-topbar\"><a class=\"back-link\" href=\"#/work/technical/science\">Technical projects<\/a><span class=\"detail-index\">SCIENCE · 02<\/span><\/nav>\n    <section class=\"detail-hero\"><div><p class=\"employer\">Science Corporation<\/p><h2>Functional film development<\/h2><\/div><p class=\"detail-lede\">Process development across the functional thin films in the device stack.<\/p><\/section><section class=\"detail-figure\"><figure class=\"figure\"><div class=\"fig-scroll\"><svg class=\"fig\" viewBox=\"0 0 900 300\" role=\"img\"><title>Illustrative electrode film stack<\/title><path class=\"m\" d=\"M60 118c40-10 60 10 100 0s60-10 100 0 60 10 100 0 60-10 100 0 60 10 100 0 60-10 100 0 60 10 100 0 60-10 100 0\"/><text class=\"\" x=\"450\" y=\"92\" text-anchor=\"middle\">BIOLOGICAL ENVIRONMENT<\/text><path class=\"flow\" pathLength=\"1\" d=\"M450 128V178\"/><path class=\"ah\" d=\"M445 173 L450 182 L455 173\"/><rect class=\"f\" x=\"80\" y=\"230\" width=\"740\" height=\"40\"/><rect class=\"layer\" x=\"80\" y=\"205\" width=\"740\" height=\"25\"/><rect class=\"a\" x=\"370\" y=\"185\" width=\"160\" height=\"20\"/><path class=\"enc\" d=\"M80 205V170H370L390 185V205ZM820 205V170H530L510 185V205Z\"/><path class=\"m\" d=\"M200 168V146\"/><text class=\"tl\" x=\"200\" y=\"138\" text-anchor=\"middle\">SiC ENCAPSULATION<\/text><path class=\"m\" d=\"M500 188L610 140\"/><text class=\"tl\" x=\"616\" y=\"136\" text-anchor=\"start\">TiN ELECTRODE<\/text><text class=\"lab\" x=\"96\" y=\"222\" text-anchor=\"start\">DIELECTRIC / BARRIER · SiN · AlN · Al₂O₃<\/text><text class=\"lab\" x=\"96\" y=\"256\" text-anchor=\"start\">SUBSTRATE<\/text><\/svg><\/div><figcaption>Illustrative electrode stack, not to scale; layer order simplified.<\/figcaption><\/figure><\/section><section class=\"detail-body\"><p class=\"detail-label\">Film systems<\/p><div><ul class=\"film-list\"><li>SiC<\/li><li>SiN<\/li><li>AlN<\/li><li>Al₂O₃<\/li><li>TiN<\/li><\/ul><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Highlights<\/p><div><ul class=\"notes\"><li><h3>SiC encapsulation<\/h3><p>Developed and qualified a sputtered SiC encapsulation for an implantable package, validating chemical stability and durability through long-term accelerated lifetime testing.<\/p><\/li><li><h3>TiN electrodes<\/h3><p>Developed sputtered TiN recipes for low-impedance recording electrodes.<\/p><\/li><li><h3>Delamination root cause<\/h3><p>When SiC films delaminated, separated four candidate causes (intrinsic stress, thermal stress, CTE mismatch and chemical contamination) and fixed the process accordingly.<\/p><\/li><li><h3>Dielectrics &amp; barriers<\/h3><p>Developed the SiN, AlN and Al₂O₃ layers that insulate and protect the stack.<\/p><\/li><\/ul><\/div><\/section><section class=\"detail-body\"><p class=\"detail-label\">Outcome<\/p><div><p class=\"single-statement\">Films that survive the body, not just the fab.<\/p><dl class=\"facts\"><div><dt>5<\/dt><dd>film systems<\/dd><\/div><div><dt>4<\/dt><dd>delamination causes isolated<\/dd><\/div><\/dl><\/div><\/section><nav class=\"detail-next\" aria-label=\"More projects\"><a class=\"pn prev\" href=\"#/work/technical/detail-science-fabrication\"><small>Previous<\/small>Full device fabrication<\/a><a class=\"pn next\" href=\"#/work/technical/detail-science-equipment\"><small>Next<\/small>Equipment ownership &amp; sustainment<\/a><\/nav>\n  <\/main>\n\n  <main class=\"detail-page\" id=\"detail-science-equipment\" hidden>\n    <nav class=\"detail-topbar\"><a class=\"back-link\" href=\"#/work/technical/science\">Technical projects<\/a><span class=\"detail-index\">SCIENCE · 03<\/span><\/nav>\n    <section class=\"detail-hero\"><div><p class=\"employer\">Science Corporation<\/p><h2>Equipment ownership &amp; sustainment<\/h2><\/div><p class=\"detail-lede\">Tool troubleshooting, repair, operation, and sustainment for semiconductor process equipment.<\/p><\/section><section class=\"detail-figure\"><figure class=\"figure\"><div class=\"fig-scroll\"><svg class=\"fig\" viewBox=\"0 0 900 360\" role=\"img\"><title>Magnetron field and plasma: healthy versus degraded magnets<\/title><g><text class=\"tl\" x=\"230\" y=\"48\" text-anchor=\"middle\">HEALTHY FIELD<\/text><text class=\"\" x=\"230\" y=\"68\" text-anchor=\"middle\">plasma confined<\/text><path class=\"d\" d=\"M110 170C110 75 230 75 230 170\"/><path class=\"d\" d=\"M230 170C230 75 350 75 350 170\"/><path class=\"d\" d=\"M110 170C110 100 230 100 230 170\"/><path class=\"d\" d=\"M230 170C230 100 350 100 350 170\"/><path class=\"d\" d=\"M110 170C110 125 230 125 230 170\"/><path class=\"d\" d=\"M230 170C230 125 350 125 350 170\"/><ellipse class=\"plasma\" cx=\"170\" cy=\"130\" rx=\"42\" ry=\"11\"/><ellipse class=\"plasma\" cx=\"290\" cy=\"130\" rx=\"42\" ry=\"11\"/><rect class=\"f\" x=\"70\" y=\"170\" width=\"320\" height=\"22\"/><text class=\"lab\" x=\"230\" y=\"186\" text-anchor=\"middle\">TARGET<\/text><rect class=\"mag\" x=\"80\" y=\"200\" width=\"60\" height=\"44\"/><text class=\"tl\" x=\"110\" y=\"227\" text-anchor=\"middle\">N<\/text><rect class=\"mag\" x=\"200\" y=\"200\" width=\"60\" height=\"44\"/><text class=\"tl\" x=\"230\" y=\"227\" text-anchor=\"middle\">S<\/text><rect class=\"mag\" x=\"320\" y=\"200\" width=\"60\" height=\"44\"/><text class=\"tl\" x=\"350\" y=\"227\" text-anchor=\"middle\">N<\/text><\/g><g><text class=\"tl\" x=\"670\" y=\"48\" text-anchor=\"middle\">DEGRADED FIELD<\/text><text class=\"\" x=\"670\" y=\"68\" text-anchor=\"middle\">plasma drops out<\/text><path class=\"m dash\" d=\"M550 170C550 128 670 128 670 170\"/><path class=\"m dash\" d=\"M670 170C670 128 790 128 790 170\"/><path class=\"m dash\" d=\"M550 170C550 144 670 144 670 170\"/><path class=\"m dash\" d=\"M670 170C670 144 790 144 790 170\"/><ellipse class=\"plasma weak\" cx=\"610\" cy=\"148\" rx=\"34\" ry=\"6\"/><ellipse class=\"plasma weak\" cx=\"730\" cy=\"148\" rx=\"34\" ry=\"6\"/><rect class=\"f\" x=\"510\" y=\"170\" width=\"320\" height=\"22\"/><text class=\"lab\" x=\"670\" y=\"186\" text-anchor=\"middle\">TARGET<\/text><rect class=\"mag weak\" x=\"520\" y=\"200\" width=\"60\" height=\"44\"/><text class=\"tl\" x=\"550\" y=\"227\" text-anchor=\"middle\">N<\/text><rect class=\"mag weak\" x=\"640\" y=\"200\" width=\"60\" height=\"44\"/><text class=\"tl\" x=\"670\" y=\"227\" text-anchor=\"middle\">S<\/text><rect class=\"mag weak\" x=\"760\" y=\"200\" width=\"60\" height=\"44\"/><text class=\"tl\" x=\"790\" y=\"227\" text-anchor=\"middle\">N<\/text><path class=\"as\" d=\"M800 300V250\"/><rect class=\"f\" x=\"770\" y=\"300\" width=\"60\" height=\"30\" rx=\"3\"/><text class=\"tl\" x=\"800\" y=\"350\" text-anchor=\"middle\">GAUSS METER<\/text><\/g><path class=\"m\" d=\"M450 40V330\"/><\/svg><\/div><figcaption>Schematic: why a sputter plasma keeps going out when the magnets behind the target weaken.<\/figcaption><\/figure><\/section><section class=\"detail-body\"><p class=\"detail-label\">Resolved faults<\/p><div><div class=\"faults\"><article><h3>RF shorting in a CCP RIE<\/h3><dl><dt>Symptom<\/dt><dd>The etcher could not run a stable plasma.<\/dd><dt>Root cause<\/dt><dd>A short in the RF path.<\/dd><dt>Fix<\/dt><dd>Located and repaired the short; returned the tool to service.<\/dd><\/dl><\/article><article><h3>Sputter plasma extinguishing<\/h3><dl><dt>Symptom<\/dt><dd>Plasma dropped out mid-deposition.<\/dd><dt>Root cause<\/dt><dd>Target overheating had degraded the magnetron magnets, weakening the confining field; confirmed with a gauss meter.<\/dd><dt>Fix<\/dt><dd>Replaced the degraded hardware and restored stable deposition.<\/dd><\/dl><\/article><article><h3>Vacuum leaks<\/h3><dl><dt>Symptom<\/dt><dd>Poor base pressure across several tools.
